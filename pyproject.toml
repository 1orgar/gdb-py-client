[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gdb-client"
version = "0.2.0"
description = "High-performance Python client for GDB with Polars-powered parallel scatter-ingest via Arrow Flight"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    { name = "GDB Team" }
]
dependencies = [
    "polars>=1.0.0",
    "pyarrow>=14.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gdb_client"]
